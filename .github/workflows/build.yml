name: Build website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and save dist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      # 已优化图片与翻页模块已提交，不需要访问本地原始素材或重新生成。
      - name: Save website files
        uses: actions/upload-artifact@v4
        with:
          name: oubao-website-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
